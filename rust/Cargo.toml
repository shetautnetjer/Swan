[package]
name = "swan"
version = "0.1.0"
edition = "2021"
description = "A code map for agents. SCIP data in, SQLite map, MCP tools out."
license = "MIT"

[[bin]]
name = "swan"
path = "src/main.rs"

[dependencies]
libc = "0.2.191"
memchr = "2.8"
# Bundles SQLite 3.54.1, the release goose-sqlite builds (commit c759de7).
libsqlite3-sys = { version = "=0.40.0", features = ["bundled"] }
# The language-server client (lsp.rs): lsp-server's Message frames the
# JSON-RPC on the server's stdin and stdout; lsp-types reads its answers.
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The SCIP index that swan lsp-index writes.
scip = "0.10"

[build-dependencies]
# Builds tree-sitter and the grammars from goose-treesitter's own C (build.rs).
cc = "=1.11.2"

[[bin]]
name = "port-trees"
path = "src/bin/port-trees.rs"

[[bin]]
name = "port-json"
path = "src/bin/port-json.rs"

[[bin]]
name = "port-sort"
path = "src/bin/port-sort.rs"

[profile.release]
opt-level = 3
