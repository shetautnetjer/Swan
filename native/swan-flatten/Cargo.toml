[package]
name = "swan-flatten"
version = "0.1.0"
edition = "2021"
description = "Rust port of tools/scip-flatten.ts: SCIP index to TSV, multi-core"

[[bin]]
name = "swan-flatten"
path = "src/main.rs"

[dependencies]
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# For trying changes: optimized like release but without LTO and with 16
# codegen units, so a rebuild after an edit takes seconds instead of ~9 s.
#   cargo build --profile quick     (or SWAN_FLATTEN_PROFILE=quick scripts/build.sh)
# The binary Swan ships is still built with the release profile above.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
